<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitCore</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#080c14;--card:#111b2c;--blue:#60a5fa;--muted:#a0aec4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7ff;font:16px system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}#app{max-width:620px;margin:auto;padding:22px 18px 110px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:28px;font-weight:900;letter-spacing:-1.4px}.brand span{color:var(--blue)}.avatar{border:1px solid #29415e;background:#111b2c;border-radius:50%;width:44px;height:44px}h1{font-size:30px;line-height:1.15;margin:8px 0}h2{font-size:21px;margin:0 0 8px}p{color:var(--muted);line-height:1.5;margin:7px 0 15px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--blue);font-weight:700}.hero{margin:24px 0 14px;padding:23px;border:1px solid #294976;border-radius:24px;background:radial-gradient(ellipse at top right,#1b4a91,transparent 65%),#111b2c}.hero-art{height:110px;display:flex;align-items:center;justify-content:center;color:#93c5fd}.hero-art svg{width:150px;height:100px;filter:drop-shadow(0 0 18px #3679d9)}.primary{background:#2563eb;border:0;border-radius:13px;padding:14px;width:100%;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile,.entry{background:var(--card);border:1px solid #22334d;border-radius:18px;padding:17px;text-align:left;width:100%}.tile strong,.entry strong{display:block}.tile p,.entry p{font-size:13px;margin:6px 0 0}.tile .symbol{font-size:30px;display:block;margin-bottom:14px}.entry{margin-top:12px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,620px);display:flex;background:#0e1624;border-top:1px solid #24334b;padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}.nav button{flex:1;min-width:0;border:0;background:none;color:var(--muted);font-size:10px;display:grid;justify-items:center;gap:5px;padding:5px 0}.nav button.active{color:var(--blue);font-weight:700}.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.notice{font-size:13px;color:var(--muted);margin-top:20px}.detail{padding:18px;margin-top:15px;border:1px solid #294976;border-radius:16px;background:#101a2a}.detail button{margin-top:12px}.page{animation:appear .22s ease-out}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.page{animation:none}}
</style>
</head>
<body>
<div id="app"><header><div class="brand">⚡ Fit<span>Core</span></div><button class="avatar" onclick="show('profile')" aria-label="Профіль">👤</button></header><main id="content"></main></div>
<nav class="nav" aria-label="Основне меню" id="nav"></nav>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
const icons={home:'<path d="M3 10 12 3l9 7v11h-6v-7H9v7H3z"/>',workouts:'<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',nutrition:'<path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18M19 3c-4 3-4 8 0 10v8M19 3v10"/>',recipes:'<path d="M5 17V10a4 4 0 0 1 3-7 5 5 0 0 1 8 0 4 4 0 0 1 3 7v7M5 17h14v4H5z"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>'};
const tabs=[['home','Головна'],['workouts','Зал'],['nutrition','Їжа'],['recipes','Рецепти'],['profile','Профіль']];
const sections={workouts:{title:'Тренування',sub:'Обирай напрям відповідно до своїх можливостей.',items:[['Розвиток сили','Базові рухи та поступове освоєння техніки.'],['Витривалість','Рух у комфортному темпі та відпочинок.'],['Загальна підготовка','Різноманітна активність для самопочуття.']]},nutrition:{title:'Харчування',sub:'Різноманітна їжа для енергії та відновлення.',items:[['Збалансоване харчування','Різні групи продуктів та регулярні прийоми їжі.'],['Активний день','Ідеї страв і перекусів для активного способу життя.'],['Меню на тиждень','Майбутній каталог ідей для сніданків, обідів і вечерь.']]},recipes:{title:'Рецепти',sub:'Знайди ідеї для домашніх страв.',items:[['Сніданки','Ідеї ранкових страв.'],['Обіди','Ідеї різноманітних обідів.'],['Вечері','Ідеї домашніх вечерь.'],['Перекуси','Прості ідеї між прийомами їжі.']]},profile:{title:'Мій профіль',sub:'Твій особистий простір FitCore.',items:[['Моя програма','Тут з’явиться обрана програма.'],['Історія тренувань','Тут з’являться завершені заняття.'],['Збережені рецепти','Тут з’являться улюблені страви.']]}};
function show(page){if(!tabs.some(t=>t[0]===page))return;document.getElementById('nav').innerHTML=tabs.map(([id,label])=>`<button class="${id===page?'active':''}" ${id===page?'aria-current="page"':''} onclick="show('${id}')"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[id]}</svg>${label}</button>`).join('');const root=document.getElementById('content');root.className='';void root.offsetWidth;root.className='page';if(page==='home'){root.innerHTML=`<div class="eyebrow">ТВІЙ ФІТНЕС-ПОМІЧНИК</div><h1>Стань сильнішим. ⚡</h1><p>Тренуйся, харчуйся та розвивайся.</p><section class="hero"><div class="hero-art"><svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"><path d="M25 35v30M43 20v60M117 20v60M135 35v30M43 50h74"/></svg></div><div class="eyebrow">TRAINING PROGRAMS</div><h2>Твоя наступна ціль</h2><p>Знайди програму тренувань для себе.</p><button class="primary" onclick="show('workouts')">Обрати тренування</button></section><div class="grid"><button class="tile" onclick="show('nutrition')"><span class="symbol">🥗</span><strong>Харчування</strong><p>Плани та меню</p></button><button class="tile" onclick="show('recipes')"><span class="symbol">🍳</span><strong>Рецепти</strong><p>Каталог страв</p></button></div><button class="entry" onclick="show('profile')"><strong>📊 Мій прогрес →</strong><p>Твоя історія тренувань</p></button>`;}else{const s=sections[page];root.innerHTML=`<div class="eyebrow">FITCORE / ${tabs.find(t=>t[0]===page)[1].toUpperCase()}</div><h1>${s.title}</h1><p>${s.sub}</p>${s.items.map(([title,desc],i)=>`<button class="entry" onclick="detail('${page}',${i})"><strong>${title} →</strong><p>${desc}</p></button>`).join('')}<div id="detail" aria-live="polite"></div><p class="notice">Демонстраційний розділ. Повні програми та збереження даних додамо пізніше.</p>`;}window.scrollTo(0,0);}
function detail(page,i){const [title,desc]=sections[page].items[i];document.getElementById('detail').innerHTML=`<div class="detail"><h2>${title}</h2><p>${desc}</p><p>Повний вміст ще в розробці.</p><button class="primary" onclick="document.getElementById('detail').replaceChildren()">Закрити</button></div>`;}
show('home');
</script>
</body>
</html>
